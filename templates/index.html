<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<title>Yarin Barber Shop - צ'אטבוט תורים</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background:#1a1a1a; color:#eee; margin:0; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:520px; height:100vh; display:flex; flex-direction:column; }
  header { padding:16px; background:#c9a25b; color:#1a1a1a; font-weight:bold; font-size:18px; text-align:center; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.4; white-space:pre-wrap; }
  .bot { align-self:flex-start; background:#2e2e2e; border-bottom-right-radius:2px; }
  .user { align-self:flex-end; background:#c9a25b; color:#1a1a1a; border-bottom-left-radius:2px; }
  form { display:flex; padding:12px; gap:8px; border-top:1px solid #333; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid #444; background:#111; color:#eee; }
  button { padding:10px 18px; border:none; border-radius:8px; background:#c9a25b; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>✂️ Yarin Barber Shop</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="כתוב/י הודעה..." />
    <button type="submit">שלח</button>
  </form>
</div>
<script>
const sessionStorageKey = 'barber_chatbot_session_id';
const sessionId = localStorage.getItem(sessionStorageKey) || crypto.randomUUID();
localStorage.setItem(sessionStorageKey, sessionId);
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

addMsg("היי! מה השם שלך ומה התור שאת/ה חושב/ת שיש לך?", "bot");

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  const res = await fetch('/chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({session_id: sessionId, message: text})
  });
  const data = await res.json();
  addMsg(data.reply, 'bot');
});
</script>
</body>
</html>
